<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Front Belt">
  <title>Front Belt</title>
  <!-- Buckle frame: a rounded square with a slot on the right for the prong.
       Drawn as two open runs, so nothing closes across the middle. -->
  <path d="M21 8.5H43Q56 8.5 56 21.5V26.6M56 38.4V42.5Q56 55.5 43 55.5H21Q8 55.5 8 42.5V21.5Q8 8.5 21 8.5"
        fill="none" stroke="#0C2346" stroke-width="5.8" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- The prong goes under the F, so the stem stays unbroken. -->
  <path d="M23 32.5H56.4" fill="none" stroke="#12B5C9" stroke-width="7.4" stroke-linecap="round"/>
  <!-- The F: stem and top arm. Its middle arm is the prong that buckles the belt. -->
  <path d="M23 20.5V46.5M23 20.5H41"
        fill="none" stroke="#0C2346" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
