        fill="none" stroke="#12305A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 31.5H44.5" fill="none" stroke="#12305A" stroke-width="7" stroke-linecap="round"/>
  <path d="M43 31.5H57" fill="none" stroke="#12B5C9" stroke-width="7" stroke-linecap="round"/>
